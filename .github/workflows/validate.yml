name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog and README synchronization
        run: python3 scripts/validate_catalog.py
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
      - name: Check repository-authored Markdown links
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path('.')
          errors = []
          for path in root.rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              for target in re.findall(r'\[[^]]+\]\(([^)]+)\)', text):
                  target = target.split('#', 1)[0]
                  if not target or '://' in target or target.startswith('mailto:'):
                      continue
                  resolved = (path.parent / target).resolve()
                  if not resolved.exists():
                      errors.append(f'{path}: missing {target}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('Relative Markdown links valid.')
          PY
